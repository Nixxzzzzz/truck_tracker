services:
  - type: web
    name: truck-tracker-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build:all
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true



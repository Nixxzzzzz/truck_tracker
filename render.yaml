services:
  - type: web
    name: truck-tracker-api
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build --workspace=web
    startCommand: npm run dev:server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: UPLOADS_DIR
        value: /var/data/uploads/photos
    disk:
      name: tracker-disk
      mountPath: /var/data
      sizeGB: 1

services:
  - type: web
    name: truck-tracker-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build --workspace=web
    startCommand: npm run dev:server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true


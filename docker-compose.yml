services:
  truck-tracker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: truck_tracker_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=truck_tracker_production_secret_key_2026
      - UPLOADS_DIR=/app/server/uploads/photos
    volumes:
      # Persistent SQLite database storage
      - tracker_data:/app/server/data
      # Persistent driver photo proofs storage
      - tracker_photos:/app/server/uploads/photos

volumes:
  tracker_data:
    driver: local
  tracker_photos:
    driver: local
